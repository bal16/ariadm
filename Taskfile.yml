version: '3'

vars:
  APP_NAME: "ariadm"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "bun"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  build:web-extension:
    summary: Builds the web extension and packages it as zip and xpi
    cmds:
      - bun run --cwd web-extension build
      - mkdir -p bin
      - sh -c 'cd web-extension/dist && zip -r ../../bin/ariadm-web-extension.zip .'
      - cp bin/ariadm-web-extension.zip bin/ariadm-web-extension.xpi
      - echo "Web extension packages written to bin/ariadm-web-extension.zip and bin/ariadm-web-extension.xpi"

  web-extension:keygen:
    summary: Generates a CRX private key at web-extension/key.pem
    cmds:
      - bunx crx keygen web-extension
      - echo "Private key written to web-extension/key.pem (keep it secret)"

  build:web-extension:crx:
    summary: Builds a signed CRX using CRX_KEY env var (path to private key)
    cmds:
      - bun run --cwd web-extension build
      - mkdir -p bin
      - sh -c 'if [ -z "$CRX_KEY" ]; then echo "CRX_KEY env var is required (path to private key)"; exit 1; fi'
      - bunx crx pack web-extension/dist -p "$CRX_KEY" -o bin/ariadm-web-extension.crx
      - echo "CRX written to bin/ariadm-web-extension.crx"

  build:web-extension:xpi:signed:
    summary: Signs the Firefox XPI using WEB_EXT_API_KEY and WEB_EXT_API_SECRET env vars
    cmds:
      - bun run --cwd web-extension build
      - mkdir -p bin
      - sh -c 'if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then echo "WEB_EXT_API_KEY and WEB_EXT_API_SECRET env vars are required"; exit 1; fi'
      - sh -c 'cd web-extension && bunx web-ext sign --source-dir dist --artifacts-dir "{{.ROOT_DIR}}/bin" --api-key "$WEB_EXT_API_KEY" --api-secret "$WEB_EXT_API_SECRET" --channel "${WEB_EXT_CHANNEL:-unlisted}"'
      - echo "Signed XPI written to bin/"

  build:release:
    summary: Builds release artifacts (binary, platform packages/AppImage, and source snapshot zip)
    cmds:
      - task: package
      - cmd: |
          set -euo pipefail
          mkdir -p "{{.BIN_DIR}}"
          git archive --format=zip --output "{{.BIN_DIR}}/{{.APP_NAME}}-source.zip" HEAD
          echo "Source snapshot written to {{.BIN_DIR}}/{{.APP_NAME}}-source.zip"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  fmt:
    summary: Formats Go and frontend sources
    cmds:
      - gofmt -w .
      - bunx oxfmt frontend/src web-extension/src

  fmt:check:
    summary: Verifies Go and frontend formatting
    cmds:
      - sh -c 'files="$(gofmt -l .)"; if [ -n "$files" ]; then printf "%s\n" "$files"; exit 1; fi'
      - bunx oxfmt --check frontend/src web-extension/src

  lint:
    summary: Runs Go and frontend linters
    cmds:
      - golangci-lint run
      - bunx oxlint frontend/src web-extension/src

  typecheck:
    summary: Type-checks the frontend workspaces with Bun
    cmds:
      - bun run typecheck

  test:
    summary: Runs backend unit tests
    cmds:
      - go test ./internal/...

  check:
    summary: Runs formatting checks, lint, typecheck, and tests
    cmds:
      - task: fmt:check
      - task: lint
      - task: typecheck
      - task: test

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
