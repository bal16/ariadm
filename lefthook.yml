pre-commit:
  parallel: true
  jobs:
    - name: gofmt
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    - name: oxlint
      glob: "*.{js,jsx,ts,tsx}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: go-test
      run: go test ./internal/...
    - name: typecheck
      run: bun run typecheck
